spring:
  application:
    name: k-drinker-api
  profiles:
    default: local
  jpa:
    open-in-view: false
  http:
    clients:
      connect-timeout: 5s
      # 텔레그램 롱 폴링(poll-timeout-seconds)보다 길어야 한다.
      read-timeout: 30s
  task:
    execution:
      # analysisExecutor 빈이 있어도 Boot 기본 실행기(applicationTaskExecutor)를 만든다. 이름 없는 @Async가 분석 스레드(1개)를 쓰지 않게 한다.
      mode: force
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 210MB

server:
  tomcat:
    max-swallow-size: 250MB

app:
  media:
    dir: ${MEDIA_DIR:./.data/media}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  auth:
    enabled: true
    totp-secret: ${TOTP_SECRET:}
    cookie-secure: true
  # P2/P3에서 사용. 지금은 비어 있어도 기동에 영향 없다.
  telegram:
    base-url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    poll-timeout-seconds: 25
    album-window: 3s
    send-retry-delay: 5s
    send-max-retries: 3
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    timeout: 120s
    max-retries: 2
  instagram:
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    user-id: ${INSTAGRAM_USER_ID:}
    base-url: https://graph.facebook.com
    api-version: v27.0
    container-poll-interval: 60s
    container-timeout: 5m
